# ─────────────────────────────────────────────────────────────────
# Gitleaks Configuration
# Prevents accidental commits of API keys, tokens, and passwords.
# Install: https://github.com/gitleaks/gitleaks
# Usage:   gitleaks detect --source . --config .gitleaks.toml
# ─────────────────────────────────────────────────────────────────

title = "Sannidh Regulon — Secret Scanning Rules"

# ─── Global Allowlists ──────────────────────────────────────────
# Files that are allowed to contain secret-like patterns
[allowlist]
  description = "Global allowlist"
  paths = [
    '''\.env\.example$''',
    '''\.gitleaks\.toml$''',
    '''node_modules/''',
    '''dist/''',
    '''\.gemini/''',
    '''package-lock\.json$''',
    '''\.test\.ts$''',
    '''\.spec\.ts$''',
  ]

# ─── Rules ──────────────────────────────────────────────────────

[[rules]]
  id = "supabase-anon-key"
  description = "Supabase Anon/Service Key (JWT)"
  regex = '''eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9\.[a-zA-Z0-9_-]{50,}\.[a-zA-Z0-9_-]{20,}'''
  tags = ["supabase", "jwt"]

[[rules]]
  id = "supabase-url"
  description = "Hardcoded Supabase project URL"
  regex = '''https://[a-z]{10,}\.supabase\.co'''
  tags = ["supabase", "url"]
  [rules.allowlist]
    regexes = [
      '''placeholder\.supabase\.co''',
      '''your-project\.supabase\.co''',
      '''example\.supabase\.co''',
      '''\*\.supabase\.co''',
    ]

[[rules]]
  id = "generic-api-key"
  description = "Generic API Key assignment"
  regex = '''(?i)(api[_-]?key|apikey)\s*[:=]\s*['"][a-zA-Z0-9_\-]{20,}['"]'''
  tags = ["api-key"]

[[rules]]
  id = "generic-secret"
  description = "Generic Secret assignment"
  regex = '''(?i)(secret[_-]?key|client[_-]?secret|auth[_-]?secret)\s*[:=]\s*['"][a-zA-Z0-9_\-]{10,}['"]'''
  tags = ["secret"]

[[rules]]
  id = "aws-access-key"
  description = "AWS Access Key ID"
  regex = '''AKIA[0-9A-Z]{16}'''
  tags = ["aws"]

[[rules]]
  id = "aws-secret-key"
  description = "AWS Secret Access Key"
  regex = '''(?i)aws_secret_access_key\s*[:=]\s*['"][a-zA-Z0-9/+=]{40}['"]'''
  tags = ["aws"]

[[rules]]
  id = "github-token"
  description = "GitHub Personal Access Token"
  regex = '''ghp_[a-zA-Z0-9]{36}|github_pat_[a-zA-Z0-9_]{80}'''
  tags = ["github"]

[[rules]]
  id = "google-api-key"
  description = "Google API Key"
  regex = '''AIza[a-zA-Z0-9_\-]{35}'''
  tags = ["google"]

[[rules]]
  id = "stripe-key"
  description = "Stripe API Key"
  regex = '''(sk|pk)_(live|test)_[a-zA-Z0-9]{20,}'''
  tags = ["stripe", "payment"]

[[rules]]
  id = "razorpay-key"
  description = "Razorpay API Key"
  regex = '''rzp_(live|test)_[a-zA-Z0-9]{14,}'''
  tags = ["razorpay", "payment"]

[[rules]]
  id = "private-key"
  description = "Private Key Block"
  regex = '''-----BEGIN (RSA |EC |DSA )?PRIVATE KEY-----'''
  tags = ["private-key"]

[[rules]]
  id = "password-assignment"
  description = "Hardcoded password in source"
  regex = '''(?i)(password|passwd|pwd)\s*[:=]\s*['"][^'"]{8,}['"]'''
  tags = ["password"]
  [rules.allowlist]
    regexes = [
      '''placeholder''',
      '''example''',
      '''changeme''',
      '''your-password''',
    ]

[[rules]]
  id = "sentry-dsn"
  description = "Sentry DSN"
  regex = '''https://[a-f0-9]{32}@[a-z0-9]+\.ingest\.sentry\.io/[0-9]+'''
  tags = ["sentry"]

[[rules]]
  id = "twilio-sid"
  description = "Twilio Account SID"
  regex = '''AC[a-f0-9]{32}'''
  tags = ["twilio"]

[[rules]]
  id = "sendgrid-key"
  description = "SendGrid API Key"
  regex = '''SG\.[a-zA-Z0-9_\-]{22}\.[a-zA-Z0-9_\-]{43}'''
  tags = ["sendgrid"]

[[rules]]
  id = "credential-url"
  description = "URL with embedded credentials"
  regex = '''https?://[a-zA-Z0-9_]+:[a-zA-Z0-9_]+@[a-zA-Z0-9._\-]+'''
  tags = ["credential-url"]
